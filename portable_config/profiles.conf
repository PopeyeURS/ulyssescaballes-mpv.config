# Base Profiles - Modular building blocks

[audio-clean]
profile-desc="Clean audio path with no DSP"
af=
audio-channels=auto
audio-device=auto
audio-exclusive=no

[base-output]
profile-desc="GPU-next Vulkan output pipeline"
vo=gpu-next
gpu-api=vulkan
gpu-context=winvk
vulkan-async-transfer=yes
vulkan-queue-count=4
vulkan-swap-mode=fifo

[base-hwdec]
profile-desc="Hardware decoding (Vulkan)"
hwdec=vulkan
hwdec-codecs=all
hwdec-extra-frames=12

[base-hdr]
profile-desc="HDR tone mapping and color pipeline"
hdr-compute-peak=yes
tone-mapping=bt.2390
tone-mapping-param=1.39
hdr-contrast-recovery=0.98
target-colorspace-hint=yes
icc-profile-auto=yes

[base-motion]
profile-desc="Motion interpolation and frame pacing"
interpolation=yes
tscale=oversample
tscale-blur=0.5
video-sync=display-resample
[base-sharp]
profile-desc="High-quality scaling and resampling"
scale=ewa_lanczossharp
cscale=catmull_rom
correct-downscaling=yes
linear-downscaling=yes

[base-filmic]
profile-desc="Filmic depth and color response"
target-trc=bt.1886
glsl-shaders-append="/shaders/Depth_reality_boost/depth_reality_boost.glsl"
glsl-shaders-append="/shaders/FilmEmulation_Kodak/Kodak_2383_Procedural.glsl"

[base-anime]
profile-desc="Anime line-art clarity and punch"
glsl-shaders-append="~~/shaders/Glimmer_sharpen/glimmer-sharpen_0.41.glsl"

[base-dither]
profile-desc="High-quality dithering"
dither=fruit
dither-depth=16
dither-size-fruit=8
temporal-dither=yes
temporal-dither-period=4

[base-deband]
profile-desc="High-quality debanding"
deband=yes
deband-iterations=4
deband-threshold=96
deband-range=10
deband-grain=6

[clear-default]
profile-desc="Reset all parameters to defaults"
glsl-shaders-clr=yes
tone-mapping=auto
hdr-compute-peak=no
hdr-contrast-recovery=0.0
scale=bilinear
cscale=bilinear
dither-depth=no
interpolation=no
tscale=linear
tscale-blur=0.0
video-sync=audio
af=
audio-channels=auto
audio-device=auto
audio-exclusive=no

[cinematic]
profile-desc="Cinematic reconstruction pipeline"
profile=base-output,base-hwdec,base-hdr,base-motion,base-sharp,base-filmic,base-dither,base-deband,audio-clean
glsl-shaders-append="/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1_enhanced.glsl"
glsl-shaders-append="/shaders/SSim/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/Adaptive_sharpen/adaptive-sharpen-1.0.glsl"

[realism]
profile-desc="HDR films with natural contrast and motion"
profile=base-output,base-hwdec,base-hdr,base-motion,base-filmic,base-dither,base-deband
tscale-blur=0.6991556596428412

[anime-hdr]
profile-desc="HDR anime with glow, depth, and line-art clarity"
profile=base-output,base-hwdec,base-hdr,base-motion,base-anime,base-sharp,base-dither,base-deband
glsl-shaders-append="/shaders/Anime4K/Restore/Anime4K_Restore_CNN_M.glsl"
glsl-shaders-append="/shaders/Anime4K/Upscale/Anime4K_Upscale_Original_x2.glsl"
glsl-shaders-append="~~/shaders/Anime4K/Denoise/Anime4K_Denoise_Bilateral_Mode.glsl"
tone-mapping=bt.2446a
tone-mapping-param=1.35
hdr-contrast-recovery=0.88
tscale-blur=0.35

[anime4k-clean]
profile-desc="Anime4K restoration/upscaling without extra sharpeners"
profile=base-output,base-hwdec,base-hdr,base-motion,base-dither,base-deband
glsl-shaders-append="/shaders/Anime4K/Restore/Anime4K_Restore_CNN_Soft_M.glsl"
glsl-shaders-append="/shaders/Anime4K/Upscale/Anime4K_Upscale_Original_x2.glsl"
glsl-shaders-append="~~/shaders/Anime4K/Denoise/Anime4K_Denoise_Bilateral_Mode.glsl"
tone-mapping=bt.2446a
tone-mapping-param=1.25
hdr-contrast-recovery=0.85
tscale-blur=0.35

[sports]
profile-desc="High motion clarity for fast content"
profile=base-output,base-hwdec,base-motion,base-dither
tscale-window=sphinx
tscale-blur=0.4
interpolation-threshold=0.01
tscale-clamp=0.0

[8k]
profile-desc="Optimized for 8K HDR60 playback"
profile=base-output,base-hwdec,base-hdr,base-sharp,base-dither
interpolation=no
hdr-peak-percentile=99.95

[debug]
profile-desc="Visual diagnostics"
osd-level=3
msg-level=all=status
