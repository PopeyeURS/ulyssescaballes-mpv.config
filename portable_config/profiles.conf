# ====
# REALISM FIDELITY
# ====
#
# Ctrl+1
# 
[realism-fidelity]
profile-desc="Maximum-fidelity reference playback based on mpv.conf"

scale=ewa_lanczossharp
cscale=catmull_rom
dscale=lanczos

correct-downscaling=yes
linear-downscaling=yes
linear-upscaling=no
sigmoid-upscaling=yes

deband=yes
deband-iterations=3
deband-threshold=48
deband-range=16
deband-grain=32

interpolation=yes

