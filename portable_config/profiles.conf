# profiles.conf — merged shaders and profiles

# Minimal audio profile (no DSP)
[audio-clean]
profile-desc=Clean audio path with no DSP
audio-filter=
audio-channels=auto
audio-device=auto
audio-exclusive=no

# Base output (GPU-next / Vulkan)
[base-output]
profile-desc=GPU-next Vulkan output pipeline
vo=gpu-next
gpu-api=vulkan
gpu-context=winvk
vulkan-async-transfer=yes
vulkan-queue-count=4
vulkan-swap-mode=fifo

# Hardware decoding
[base-hwdec]
profile-desc=Hardware decoding (Vulkan)
hwdec=vulkan
hwdec-codecs=all
hwdec-extra-frames=12

# HDR / tone mapping base
[base-hdr]
profile-desc=HDR tone mapping and color pipeline
hdr-compute-peak=yes
tone-mapping=bt.2390
tone-mapping-param=1.39
hdr-contrast-recovery=0.98
target-colorspace-hint=yes
icc-profile-auto=yes

# Motion / frame pacing
[base-motion]
profile-desc=Motion interpolation and frame pacing
interpolation=yes
tscale=oversample
tscale-blur=0.5
video-sync=display-resample

# Scaling / sharpness
[base-sharp]
profile-desc=High-quality scaling and resampling
scale=ewa_lanczossharp
cscale=catmull_rom
correct-downscaling=yes
linear-downscaling=yes

# Filmic color response and depth (shaders)
[base-filmic]
profile-desc=Filmic depth and color response
target-trc=bt.1886
glsl-shader="~~/shaders/Depth_reality_boost/depth_reality_boost.glsl"
glsl-shader="~~/shaders/FilmEmulation_Kodak/Kodak_2383_Procedural.glsl"

# Anime-specific sharpening shader
[base-anime]
profile-desc=Anime line-art clarity and punch
glsl-shader="~~/shaders/Glimmer_sharpen/glimmer-sharpen_0.40.glsl"

# Dithering
[base-dither]
profile-desc=High-quality dithering
dither=fruit
dither-depth=16
dither-size-fruit=8
temporal-dither=yes
temporal-dither-period=4

# Debanding
[base-deband]
profile-desc=High-quality debanding
deband=yes
deband-iterations=4
deband-threshold=96
deband-range=10
deband-grain=6

# Clear / safe defaults (use to reset to conservative values)
[clear-default]
profile-desc=Reset many parameters to conservative defaults
# Visual defaults
scale=bilinear
cscale=bilinear
target-trc=auto
tone-mapping=auto
hdr-compute-peak=no
hdr-contrast-recovery=0.0
# Motion defaults
interpolation=no
tscale=linear
tscale-blur=0.0
video-sync=audio
# Audio defaults
audio-filter=
audio-channels=auto
audio-device=auto
audio-exclusive=no
# Dither / deband defaults
dither=none
dither-depth=0
deband=no
# Debug/logging conservative default
msg-level=all=warn

# Cinematic composite profile (ordered shaders: depth -> upscalers -> sharpen)
[cinematic]
profile-desc=Cinematic reconstruction pipeline
profile=base-output,base-hwdec,base-hdr,base-motion,base-sharp,base-filmic,base-dither,base-deband,audio-clean
# Depth / bloom first
glsl-shader="~~/shaders/Depth_reality_boost/depth_reality_boost.glsl"
# Upscaling / super-res
glsl-shader="~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1_enhanced.glsl"
glsl-shader="~~/shaders/SSim/SSimSuperRes.glsl"
# Adaptive sharpen last
glsl-shader="~~/shaders/Adaptive_sharpen/adaptive-sharpen-1.0.glsl"
# Optional extra sharpen (kept commented to allow toggling)
# glsl-shader="~~/shaders/Glimmer_sharpen/glimmer-sharpen_0.40.glsl"

# Realism (HDR films, natural contrast)
[realism]
profile-desc=HDR films with natural contrast and motion
profile=base-output,base-hwdec,base-hdr,base-motion,base-filmic,base-dither,base-deband
tscale-blur=0.6991556596428412

# Anime HDR (line-art clarity + upscaling)
[anime-hdr]
profile-desc=HDR anime with glow, depth, and line-art clarity
profile=base-output,base-hwdec,base-hdr,base-motion,base-anime,base-sharp,base-dither,base-deband
glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_M.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale/Anime4K_Upscale_Original_x2.glsl"
glsl-shader="~~/shaders/Anime4K/Denoise/Anime4K_Denoise_Bilateral_Mode.glsl"
tone-mapping=bt.2446a
tone-mapping-param=1.35
hdr-contrast-recovery=0.88
tscale-blur=0.35

# Anime4K clean (less sharpening)
[anime4k-clean]
profile-desc=Anime4K restoration/upscaling without extra sharpeners
profile=base-output,base-hwdec,base-hdr,base-motion,base-dither,base-deband
glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_Soft_M.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale/Anime4K_Upscale_Original_x2.glsl"
glsl-shader="~~/shaders/Anime4K/Denoise/Anime4K_Denoise_Bilateral_Mode.glsl"
tone-mapping=bt.2446a
tone-mapping-param=1.25
hdr-contrast-recovery=0.85
tscale-blur=0.35

# Sports (fast motion)
[sports]
profile-desc=High motion clarity for fast content
profile=base-output,base-hwdec,base-motion,base-dither
tscale-window=sphinx
tscale-blur=0.4
interpolation-threshold=0.01
tscale-clamp=0.0

# 8K optimized profile
[8k]
profile-desc=Optimized for 8K HDR60 playback
profile=base-output,base-hwdec,base-hdr,base-sharp,base-dither
interpolation=no
hdr-peak-percentile=99.95

# Debug / diagnostics
[debug]
profile-desc=Visual diagnostics and verbose logging
osd-level=3
msg-level=all=info

# -------------------------
# Shader parameter sections
# Section names must match the shader filenames (case-sensitive) as used in glsl-shader lines.

# Depth Reality Boost — Cinematic Depth & Bloom
[depth_reality_boost.glsl]
# Perceptual depth and bloom control
strength=0.85
radius=0.90
warmth=0.12

# Glimmer Sharpen 0.40 — Adaptive Cinematic Edition
[glimmer-sharpen_0.40.glsl]
# Adaptive sharpen controls; tune glint_boost and luma_threshold to taste
strength=0.45
glint_boost=1.80
luma_threshold=0.82
softness=0.12
noise_intensity=0.015
reflection_mix=0.40
