# Base Profiles — Modular building blocks

[audio-clean]
profile-desc="Disables filters for clean audio path"
af=
audio-channels=auto
audio-device=auto
audio-exclusive=no

[base-hdr]
hdr-compute-peak=yes
tone-mapping=bt.2390
cscale=catmull_rom
dither-depth=auto

[base-motion]
interpolation=yes
tscale=oversample
tscale-blur=0.5
video-sync=display-resample

[base-sharp]
scale=ewa_lanczossharp
cscale=catmull_rom

[base-filmic]
target-trc=bt.1886
glsl-shaders-append="~~/shaders/depth_reality_boost.glsl"

[base-anime]
glsl-shaders-append="~~/shaders/Glimmer_sharpen/glimmer-sharpen_0.40.glsl"

[clear-default]
profile-desc="Reset all parameters to defaults"
# Disable shaders
glsl-shaders-clr=yes

# Reset tone mapping and HDR
tone-mapping=auto
hdr-compute-peak=no
hdr-contrast-recovery=0.0

# Reset scaling/sharpening
scale=bilinear
cscale=bilinear
dither-depth=no

# Reset motion/interpolation
interpolation=no
tscale=linear
tscale-blur=0.0
video-sync=audio

# Reset audio
af=
audio-channels=auto
audio-device=auto
audio-exclusive=no

# Content-Specific Profiles

[8k]
profile-desc="Optimized for 8K HDR60 playback"
profile=base-hdr,base-sharp
interpolation=no
hdr-peak-percentile=99.95

[realism]
profile-desc="Cinematic realism for HDR films"
profile=base-hdr,base-motion,base-filmic
tscale-blur=0.6991556596428412

[anime-hdr]
profile-desc="HDR anime with glow, depth, and line-art clarity"
profile=base-hdr,base-motion,base-anime,base-sharp

# Anime4K restoration and upscaling
glsl-shaders-append="~~/shaders/Anime4K/Restore/Anime4K_Restore_C.glsl"
glsl-shaders-append="~~/shaders/Anime4K/Upscale-Denoise/Anime4K_Upscale_Denoise_B.glsl"

# Custom glow and depth shaders
glsl-shaders-append="~~/shaders/AnimeGlow/anime-glow.glsl"
glsl-shaders-append="~~/shaders/Depth_reality_boost/depth_reality_boost.glsl"
glsl-shaders-append="~~/shaders/Glimmer_sharpen/glimmer-sharpen_0.41.glsl"

# HDR tone mapping and contrast
tone-mapping=bt.2446a
tone-mapping-param=1.35
hdr-contrast-recovery=0.88

# Motion and clarity tuning
tscale-blur=0.35
icc-profile-auto=yes

[sports]
profile-desc="High motion clarity"
profile=base-motion
tscale-window=sphinx
tscale-blur=0.4
interpolation-threshold=0.01
tscale-clamp=0.0

[debug]
profile-desc="Visual diagnostics"
osd-level=3
msg-level=all=status
