# Base profiles for modular setup

[base-output]
vo=gpu-next
gpu-api=vulkan
gpu-context=winvk
vulkan-async-transfer=yes
vulkan-queue-count=4
vulkan-swap-mode=fifo

[base-hwdec]
hwdec=vulkan
hwdec-codecs=all
hwdec-extra-frames=12
vd-lavc-dr=yes
vd-lavc-threads=6

[base-hdr]
icc-profile-auto=yes
hdr-peak-percentile=99.995
hdr-compute-peak=yes
hdr-contrast-recovery=0.10
tone-mapping=bt.2390
tone-mapping-param=1.495
target-colorspace-hint-mode=source-dynamic
target-trc=pq
target-prim=bt.2020
target-peak=180
gamma=1.05
contrast=1.1895
brightness=0.109
saturation=1.44
vd-lavc-threads=8

[base-motion]
interpolation=yes
initial-audio-sync=yes
framedrop=vo
video-sync=audio
tscale=oversample
tscale-window=sphinx
tscale-blur=0.6991556596428412
tscale-clamp=0.0
tscale-radius=0.9
tscale-taper=0.0
tscale-antiring=0.005
video-sync-max-video-change=3

# Realism (HDR films, natural contrast)
[realism]
profile-desc=HDR films with natural contrast and motion
profile=base-output,base-hwdec,base-hdr,base-motion
tscale-blur=0.6991556596428412

# Anime HDR
[anime-hdr]
profile-desc=HDR anime with glow, depth, and line-art clarity
profile=base-output,base-hwdec,base-hdr,base-motion
glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_M.glsl"
glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Clamp_Highlights.glsl"
tone-mapping=bt.2446a
tone-mapping-param=1.35
hdr-contrast-recovery=0.88
tscale-blur=0.35

[demo-hdr]
profile=base-output,base-hwdec,base-hdr,base-motion
tone-mapping=bt.2390
tone-mapping-param=1.25
hdr-contrast-recovery=0.30
target-peak=auto
gamma=1.0
contrast=1.05
saturation=1.20

