# Realism (HDR films, natural contrast)
[realism]
profile-desc=HDR films with natural contrast and motion
profile=base-output,base-hwdec,base-hdr,base-motion,base-filmic,base-dither,base-deband
tscale-blur=0.6991556596428412

# Anime HDR
[anime-hdr]
profile-desc=HDR anime with glow, depth, and line-art clarity
profile=base-output,base-hwdec,base-hdr,base-motion,base-anime,base-sharp,base-dither,base-deband
# Use restore CNN-M (exists in your folder)
glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_M.glsl"
# Optional: swap to CNN_L or CNN_S if you prefer different strength
# glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_L.glsl"
# glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_S.glsl"
# Clamp highlights (exists in your folder)
glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Clamp_Highlights.glsl"

tone-mapping=bt.2446a
tone-mapping-param=1.35
hdr-contrast-recovery=0.88
tscale-blur=0.35

# Anime4K clean (less sharpening)
[anime4k-clean]
profile-desc=Anime4K restoration/upscaling without extra sharpeners
profile=base-output,base-hwdec,base-hdr,base-motion,base-dither,base-deband
glsl-shader="~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_Soft_M.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale/Anime4K_Upscale_Original_x2.glsl"
glsl-shader="~~/shaders/Anime4K/Denoise/Anime4K_Denoise_Bilateral_Mode.glsl"
tone-mapping=bt.2446a
tone-mapping-param=1.25
hdr-contrast-recovery=0.85
tscale-blur=0.35

# Sports (fast motion)
[sports]
profile-desc=High motion clarity for fast content
profile=base-output,base-hwdec,base-motion,base-dither
tscale-window=sphinx
tscale-blur=0.4
interpolation-threshold=0.01
tscale-clamp=0.0

# 8K optimized profile
[8k]
profile-desc=Optimized for 8K HDR60 playback
profile=base-output,base-hwdec,base-hdr,base-sharp,base-dither
interpolation=no
hdr-peak-percentile=99.95

# Shader option overrides
[depth_reality_boost.glsl]
glsl-shader-opts=strength=0.85,radius=0.90,warmth=0.12

[glimmer-sharpen_0.41.glsl]
glsl-shader-opts=strength=0.45,glint_boost=1.80,luma_threshold=0.82,softness=0.12,noise_intensity=0.015,reflection_mix=0.40