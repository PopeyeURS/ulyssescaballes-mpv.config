# Base Profiles — Modular building blocks

[audio-clean]
profile-desc="Disables filters for clean audio path"
af=
audio-channels=auto
audio-device=auto
audio-exclusive=no

[base-hdr]
hdr-compute-peak=yes
tone-mapping=bt.2390
cscale=catmull_rom
dither-depth=auto

[base-motion]
interpolation=yes
tscale=oversample
tscale-blur=0.5
video-sync=display-resample

[base-sharp]
scale=ewa_lanczossharp
cscale=catmull_rom

[base-filmic]
target-trc=bt.1886
glsl-shaders-append="~~/shaders/depth_reality_boost.glsl"

[base-anime]
glsl-shaders-append="~~/shaders/Glimmer_sharpen/glimmer-sharpen_0.40.glsl"

# Content-Specific Profiles

[8k]
profile-desc="Optimized for 8K HDR60 playback"
profile=base-hdr,base-sharp
interpolation=no
hdr-peak-percentile=99.95

[realism]
profile-desc="Cinematic realism for HDR films"
profile=base-hdr,base-motion,base-filmic
tscale-blur=0.6991556596428412

[anime]
profile-desc="Line-art clarity for anime"
profile=base-motion,base-anime,base-sharp
tscale-blur=0.45

[sports]
profile-desc="High motion clarity"
profile=base-motion
tscale-window=sphinx
tscale-blur=0.4
interpolation-threshold=0.01
tscale-clamp=0.0
