# mpv.conf
# 🎞️ Version 58.0 – ULTIMATE PREMIUM PLATINUM REFERENCE BUILD - ⚠️DO NOT MODIFY⚠️ 🎞️
# Created for MPV by: Ulysses RS Caballes - Maximally enhanced to perfection.
# 20260815 212614LT

# PROFILE & MODULARITY
include="~~/profiles.conf"
input-default-bindings=yes
load-scripts=yes

# VIDEO OUTPUT & QUALITY
vo=gpu-next
gpu-api=vulkan
gpu-context=winvk
gpu-shader-cache=yes
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=4
vulkan-swap-mode=fifo

# DECODER OPTIONS
vd-lavc-dr=yes
vd-lavc-threads=8
video-output-levels=full
vf=format=colorlevels=full:colormatrix=auto

# COLOR MANAGEMENT
icc-profile-auto=yes
icc-intent=2
icc-3dlut-size=256x256x256
icc-cache-dir="~~/icc-cache"

# HARDWARE DECODING
hwdec=nvdec
hwdec-codecs=all
hwdec-extra-frames=12

# HDR & TONE MAPPING
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.115
tone-mapping=bt.2390
tone-mapping-param=1.495
target-colorspace-hint=yes
target-colorspace-hint-mode=source-dynamic
target-trc=pq
target-prim=bt.2020
target-gamut=dci-p3
target-peak=180

# GAMMA / PERCEPTUAL LINEARITY
gamma=1.135
contrast=1.185
brightness=0.109
saturation=1.395

# SCALING & RESAMPLING
scale=ewa_lanczossharp
scale-clamp=0.02
scale-antiring=0.005
cscale=catmull_rom
dscale=lanczos
correct-downscaling=yes
linear-downscaling=yes
linear-upscaling=no
sigmoid-upscaling=yes

# SHADER
glsl-shader="~~/shaders/CuNNy/ds/dp4a/CuNNy-8x32-DS-Q.glsl"
glsl-shader="~~/shaders/SSim/SSimSuperRes.glsl"
glsl-shader="~~/shaders/Depth_reality_boost/depth_reality_boost.glsl"
glsl-shader="~~/shaders/Adaptive_sharpen/adaptive-sharpen-1.1.glsl"
glsl-shader-opts=debug=no,fast=no,strength=0.88

# INTERPOLATION & FRAME SYNC
interpolation=yes
framedrop=no
video-sync=audio
tscale=oversample
tscale-window=sphinx
tscale-blur=0.6991556596428412
tscale-clamp=0.0
tscale-radius=1.0
tscale-taper=0.0
tscale-antiring=0.01
video-sync-max-video-change=0.01

# DITHERING
dither=error-diffusion
dither-depth=16
dither-size-fruit=8
error-diffusion=burkes
temporal-dither=yes
temporal-dither-period=4

# DEBANDING
deband=yes
deband-iterations=3
deband-threshold=48
deband-range=16
deband-grain=32

# AUDIO
ao=wasapi
audio-exclusive=no
audio-device=auto
audio-spdif=ac3,eac3,dts,dts-hd,truehd
audio-normalize-downmix=yes
audio-channels=auto
gapless-audio=yes
audio-pitch-correction=no
audio-file-auto=fuzzy
audio-buffer=0.1
demuxer-readahead-secs=10
demuxer-max-bytes=200M
volume=50

# YTDL FORMAT FILTER
ytdl-format=bestvideo[height<=?2160][vcodec~=av01]+bestaudio[format_id!*=-drc]/bestvideo[height<=?2160][vcodec*=vp9]+bestaudio[format_id!*=-drc]/bestvideo[height<=?2160]+bestaudio[format_id!*=-drc]/best
hls-bitrate=max

# SEEKING
hr-seek=yes
hr-seek-framedrop=no

# PLAYBACK BEHAVIOR
keep-open=no
keep-open-pause=no
force-seekable=yes
save-position-on-quit=yes
directory-mode=ignore

# WINDOW & UI
osc=no
border=no
autofit=60%x60%
ontop=no
snap-window=yes
cursor-autohide=600
force-window=yes
idle=no

# SCREENSHOTS (LOSSLESS / HIGH FIDELITY)
screenshot-sw=yes
screenshot-format=png
screenshot-template='%F - [%05n]'
screenshot-high-bit-depth=yes
screenshot-png-compression=4
screenshot-tag-colorspace=yes

# SUBTITLES
sub-font="Segoe UI Light"
sub-font-size=60
sub-color="#ffff00"
sub-border-size=1.0
sub-outline-color="#ff0000"
sub-shadow-color="#000000"
sub-shadow-offset=0.5
sub-blur=0.0
sub-back-color="#00000000"
sub-auto=fuzzy
sub-ass-override=yes
sub-ass-scale-with-window=no
sub-fix-timing=yes
blend-subtitles=yes
demuxer-mkv-subtitle-preroll=yes
sub-file-paths=sub,subs,subtitles
slang=en,eng,English
alang=en,eng,English
script-opts-append=trackselect-preferred_sub_lang=en/eng/english
script-opts-append=trackselect-preferred_sub_words=hearing_impaired/SDH/HI
script-opts-append=trackselect-excluded_sub_words=sign/s&s
script-opts-append=trackselect-preferred_audio_lang=en/eng/English
sub-clear-on-seek=yes
sub-delay=0

# OSD FLASH STYLING
osd-font="Segoe UI"
osd-font-size=26
osd-color="#FFFFFF"
osd-border-color="#000000"
osd-border-size=1
osd-shadow-color="#000000"
osd-shadow-offset=1
osd-align-x=center
osd-align-y=top
osd-margin-y=40
osd-level=1
osd-status-msg=${filename}
osd-duration=3000
