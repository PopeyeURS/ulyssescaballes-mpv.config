# main_headset.conf
# Place in mpv/script-opts/ folder
# Used by main_headset.lua

sofa_path=sofa/hrtf.sofa
ir_path=sofa/theatre_ir.wav

sample_rate=48000
channel_layout_headset=stereo
channel_layout_speakers=5.1

headset_eq_profile=imax        # imax for clarity, gaming for impact
speaker_eq_profile=cinema      # fallback if you switch to speakers

loudnorm_headset=true
loudnorm_speaker=false
loudnorm_I=-21
loudnorm_TP=-1.5
loudnorm_LRA=6

normalize_fir=true
dynamic_enabled=true