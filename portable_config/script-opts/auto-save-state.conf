# auto-save-state.conf
# Automatically saves playback state and restores it on next launch

# Enable auto-save
enabled=yes

# Save interval in seconds (e.g., every 30 seconds)
save_interval=30

# Save playback position
save_position=yes

# Save volume level
save_volume=yes

# Save subtitle and audio track selections
save_tracks=yes

# Save playback speed
save_speed=yes
