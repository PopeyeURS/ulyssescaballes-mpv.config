# main_cinema.conf
# Place in mpv/script-opts/ folder
# Used by main_cinema.lua

# Paths for convolution filters
sofa_path=sofa/hrtf_M_normal_pinna_resolution_0.5_deg.sofa
brir_path=sofa/ClubFritz12.sofa
ir_path=sofa/theatre_ir.wav

# Audio parameters
sample_rate=48000
channel_layout_speakers=5.1

# EQ profile
speaker_eq_profile=cinema

# Loudness normalization (speaker only)
loudnorm_speaker=yes
loudnorm_I=-24
loudnorm_TP=-2
loudnorm_LRA=8

# FIR normalization and dynamics
normalize_fir=yes
dynamic_enabled=yes
