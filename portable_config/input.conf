# Mouse / basic playback
MBTN_RIGHT cycle pause
SPACE cycle pause

. frame-step
, frame-back-step

LEFT script-binding evafast/evafast-rewind
RIGHT script-binding evafast/evafast
MBTN_BACK script-binding evafast/evafast-rewind
MBTN_FORWARD script-binding evafast/evafast

# Seeking (big jumps)
UP no-osd seek 84.25
DOWN no-osd seek -84.25

# Volume wheel
WHEEL_UP no-osd add volume 2
WHEEL_DOWN no-osd add volume -2

# Window / fullscreen
MBTN_LEFT_DBL cycle fullscreen
ESC set fullscreen no
F cycle fullscreen

# Clipboard / playlist / UI (uosc)
Ctrl+c script-binding uosc/copy-to-clipboard
Ctrl+v script-binding uosc/paste-to-playlist
tab script-binding uosc/menu

# Stats and console
` script-binding stats/display-stats-toggle
~ script-binding console/enable

# Custom script bindings (ensure these names exist in your scripts)
b script-binding midrange_boost
r script-binding recover_shaders

# uosc menu shortcuts
o script-binding uosc/open-file
y script-binding uosc_youtube_search/open-menu
h script-binding memo-history
k script-binding uosc/keybinds
v script-binding uosc_video_settings/open-menu
a script-binding uosc/audio-device
s script-binding uosc_subtitle_settings/open-menu
p script-binding uosc_screenshot/open-menu

# IMAX audio chain bindings
F9      script-message headset_imax
Ctrl+F9 script-message headset_gaming

F10     script-message speaker_cinema
Ctrl+F10 script-message speaker_flat

F11     script-message reset_filters
Shift+F11 script-message inspect_filters

F12     script-message speaker_cinema_plus

# Profile switching (clear audio filters first, then apply profile)
Ctrl+1 script-message switch_clear
Ctrl+2 script-message switch_anime
Ctrl+3 script-message switch_realism
Ctrl+4 script-message switch_sports
Ctrl+5 script-message switch_debug

# Quick profile toggle: cycle the profile property, clear filters, then apply the selected profile
F cycle-values profile gpu-hq gpu-next; af clear; apply-profile ${profile}; show-text "▶ Profile switched: ${profile}" 1200

# Helpful quick actions
q quit
Ctrl+q quit-watch-later
m cycle mute
+ add volume 2
- add volume -2

# Frame stepping precision (optional)
SHIFT+. frame-step
SHIFT+, frame-back-step

# Safety: avoid accidental long-running external commands; keep bindings internal
# If any script still appends filters, edit that script to call 'af clear' before adding or to use apply-profile.
