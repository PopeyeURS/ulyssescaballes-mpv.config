# ====

# ====
# VIDEO PROFILES
# ====
#   Ctrl+1 = Realism Fidelity
#   Ctrl+2 = Anime Fidelity
#   Ctrl+3 = Sports Fidelity
#   Ctrl+4 = Debug
#
# ====
# AUDIO MODES FROM main.lua
# ====
#   F9  = Pure
#   F10 = Cinema
#   F11 = Music / Concert
#   F12 = Clear

# ====
# OTHER
# ====
#   B     = Midrange Boost
#   Ctrl+F = GPU renderer toggle

# ====
# BASIC PLAYBACK
# ====
MBTN_RIGHT cycle pause
SPACE cycle pause


# ====
# FRAME STEPPING
# ====
. frame-step
, frame-back-step

SHIFT+. frame-step
SHIFT+, frame-back-step

# ====
# FAST SEEK
# ====
LEFT script-binding evafast/evafast-rewind
RIGHT script-binding evafast/evafast

MBTN_BACK script-binding evafast/evafast-rewind
MBTN_FORWARD script-binding evafast/evafast

# ====
# LARGE SEEK
# ====
UP no-osd seek 84.25
DOWN no-osd seek -84.25

# ====
# VOLUME
# ====
WHEEL_UP no-osd add volume 2
WHEEL_DOWN no-osd add volume -2
+ add volume 2
- add volume -2
m cycle mute

# ====
# WINDOW / FULLSCREEN
# ====
MBTN_LEFT_DBL cycle fullscreen
F cycle fullscreen
ESC set fullscreen no

# ====
# CLIPBOARD / PLAYLIST / UOSC
# ====
Ctrl+c script-binding uosc/copy-to-clipboard
Ctrl+v script-binding uosc/paste-to-playlist
TAB script-binding uosc/menu
o script-binding uosc/open-file
y script-binding uosc_youtube_search/open-menu
h script-binding memo-history
k script-binding uosc/keybinds
v script-binding uosc_video_settings/open-menu
a script-binding uosc/audio-device
s script-binding uosc_subtitle_settings/open-menu
p script-binding uosc_screenshot/open-menu
Shift+s script-binding uosc_screenshot/screenshot

# ====
# STATISTICS / CONSOLE
# ====
` script-binding stats/display-stats-toggle
~ script-binding console/enable

# ====
# COMPLETE PLAYBACK INFORMATION
# ====
I show-text "Audio: ${audio-codec} | Format: ${audio-format} | Bitrate: ${audio-bitrate} | Rate: ${audio-samplerate} Hz | Channels: ${audio-channels}\nOutput: ${ao} | Device: ${audio-device}\nAudio Filters: ${af}\nVideo Filters: ${vf}\nVolume: ${volume}% | Mute: ${mute}"

# ====
# MIDRANGE BOOST
# ====
b script-binding midrange_boost

# ====
# VIDEO PROFILE SWITCHING
# ====
#
# These profiles control VIDEO presentation only.
#
# main.lua remains exclusively responsible for AUDIO modes.
#
# Ctrl+1 = Realism Fidelity
# Ctrl+2 = Anime Fidelity
# Ctrl+3 = Sports Fidelity
# Ctrl+4 = Debug
# Ctrl+5 = intentionally unused
# ====

# ====
# Ctrl+1 = REALISM FIDELITY
# ====
Ctrl+1 apply-profile realism-fidelity ; show-text "▶ Video Profile: Realism Fidelity" 1200

# ====
# Ctrl+2 = ANIME FIDELITY
# ====
Ctrl+2 apply-profile anime-fidelity ; show-text "▶ Video Profile: Anime Fidelity" 1200

# ====
# Ctrl+3 = SPORTS FIDELITY
# ====
Ctrl+3 apply-profile sports-fidelity ; show-text "▶ Video Profile: Sports Fidelity" 1200

# ====
# Ctrl+4 = DEBUG
# ====
Ctrl+4 apply-profile debug ; show-text "▶ Video Profile: Debug" 1200
